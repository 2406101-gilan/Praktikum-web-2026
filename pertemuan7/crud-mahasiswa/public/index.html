<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Data Mahasiswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Manajemen Data Mahasiswa</h2>
    <p class="subtitle">Sistem CRUD 100% JavaScript: Node.js, Express, Fetch API &amp; MySQL Laragon</p>

    <div id="alertMessage" class="alert" style="display:none;"></div>

    <div class="form-card">
      <h3 id="formTitle">Tambah Mahasiswa Baru</h3>
      <form id="mhsForm">
        <input type="hidden" id="mhsId">
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="nim">NIM <span class="req">*</span></label>
            <input type="text" id="nim" required placeholder="Contoh: 240101003">
          </div>
          <div class="form-group flex-1">
            <label for="nama">Nama Lengkap <span class="req">*</span></label>
            <input type="text" id="nama" required placeholder="Nama mahasiswa">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="jurusan">Program Studi <span class="req">*</span></label>
            <select id="jurusan" required>
              <option value="">-- Pilih Jurusan --</option>
              <option value="Teknik Informatika">Teknik Informatika</option>
              <option value="Sistem Informasi">Sistem Informasi</option>
              <option value="Teknik Elektro">Teknik Elektro</option>
              <option value="Manajemen">Manajemen</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" required placeholder="nama@kampus.ac.id">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="btnSubmit" class="btn btn-primary">Simpan Mahasiswa</button>
          <button type="button" id="btnCancel" class="btn btn-secondary" style="display:none;">Batal Edit</button>
        </div>
      </form>
    </div>

    <div class="table-card">
      <!-- Fitur 3: Counter total -->
      <p class="total-info">Total Mahasiswa Terdaftar: <strong id="totalCount">0</strong> Orang</p>
      <!-- Fitur 1: Pencarian real-time -->
      <input type="text" id="searchInput" class="search-input" placeholder="Cari nama atau NIM...">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>NIM</th>
            <th>Nama Lengkap</th>
            <th>Jurusan</th>
            <th>Email</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="mhsTableBody"></tbody>
      </table>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
