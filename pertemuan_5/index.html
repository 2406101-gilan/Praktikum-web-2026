<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List - Modul 5</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-app">
        <h2>Daftar Tugas Saya</h2>

        <!-- FITUR 1: Penghitung jumlah tugas -->
        <p id="taskCounter" class="task-counter" aria-live="polite"></p>

        <!-- Form Input Tugas -->
        <form id="todoForm" novalidate>
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Ketikkan tugas baru
Anda...">
                <button type="submit" class="add-btn">Tambah</button>
            </div>
            <div class="error-message" id="inputError">Tugas tidak boleh kosong atau
                kurang dari 3 karakter!</div>
            <div class="error-message" id="inputError1">TUGAS MAKSIMUM 5</div>
        </form>
        <!-- Daftar Tugas -->
        <ul class="todo-list" id="todoList"></ul>

        <!-- FITUR 2: Tombol bersihkan tugas selesai -->
        <button type="button" id="clearCompletedBtn" class="clear-btn">Bersihkan Tugas Selesai</button>

    </div>
    <script src="script.js"></script>
</body>

</html>
